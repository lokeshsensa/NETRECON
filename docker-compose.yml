version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./netrecon.db
      - JWT_SECRET=netrecon-production-secret-change-me
      - SCAN_TIMEOUT=600
      - MAX_CONCURRENT_SCANS=3
    volumes:
      - ./backend/netrecon.db:/app/netrecon.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
